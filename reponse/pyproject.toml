[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexuscam"
version = "2.0.0"
description = "Multi-transport camera intelligence: capture, control, enhancement, anthropometry, and kinematic speed."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "NexusCam" }]
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "websockets>=12.0",
  "aiofiles>=23.2",
  "scipy>=1.13",
  "bleak>=0.22",
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "httpx>=0.27"]

[project.scripts]
nexuscam = "nexuscam.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexuscam = ["ui/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
