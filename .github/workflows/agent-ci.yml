name: NOVA-APEX safety checks

on:
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/agent-ci.yml"
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/agent-ci.yml"

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Set up Node for static JavaScript validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi "uvicorn[standard]" websockets pydantic httpx rich python-dotenv keyring pytest
      - name: Compile Python modules
        run: python -m compileall -q nova_apex main.py
      - name: Validate Mission Control JavaScript syntax
        run: node --check nova_apex/server/static/app.js
      - name: Run non-destructive security tests
        run: python -m pytest -q tests/test_safety.py
